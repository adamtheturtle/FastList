# SwiftLint configuration for FastList.
# Lints the hand-written sources and tests; the SwiftPM build directory holds
# generated code (e.g. the test entry point) that we never want to lint.

included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  # The package is deliberately a single-file library: the coordinator, its diffing,
  # and the view representables are one cohesive unit, and splitting them across
  # files to satisfy a line count would obscure that rather than clarify it.
  - file_length
  - type_body_length
