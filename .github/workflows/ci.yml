name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: >-
          xcodebuild -scheme FastList
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/FastList-iOS"
          CODE_SIGNING_ALLOWED=NO build

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test shared targets on iOS
        run: >-
          xcodebuild -scheme FastList
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -derivedDataPath "$RUNNER_TEMP/FastList-iOS-Test"
          CODE_SIGNING_ALLOWED=NO
          test

  prose:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # ai-tells bans em dashes and other AI-written prose patterns.  The style package is pinned in
      # ``.vale.ini`` and ``vale sync`` downloads it into the gitignored
      # ``styles`` directory.
      - name: Sync Vale styles
        run: uvx vale@3.13.0.0 sync
      - name: Lint prose
        run: git ls-files '*.md' | xargs --no-run-if-empty uvx vale@3.13.0.0
