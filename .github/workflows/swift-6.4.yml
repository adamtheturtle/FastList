name: Swift 6.4

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-6.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift 6.4)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Select stable Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
