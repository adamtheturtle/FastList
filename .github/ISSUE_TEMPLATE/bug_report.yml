name: Bug report
description: Report a defect in FastList behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail to reproduce on macOS
        or the iOS Simulator.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a small sample.
      placeholder: |
        1. Build FastListDemo
        2. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - iOS / iPadOS
        - Both
        - Unsure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: FastList version or commit, Xcode, and OS.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
