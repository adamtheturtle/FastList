name: Feature request
description: Propose an API or behavior change for FastList
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FastList owns native list mechanics. Prefer proposals that fit that boundary
        (see CONTRIBUTING.md) over app-specific domain behavior.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Suggested API or behavior, with a short example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you tried.
    validations:
      required: false
